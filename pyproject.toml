[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tv90"
version = "0.1.0"
description = "90s Cable TV Nostalgia Box"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tv90"]

[tool.hatch.build.targets.wheel.force-include]
"src/tv90/data/keyword_rules.toml" = "tv90/data/keyword_rules.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["tv90.domain", "tv90.application", "tv90.config"]
