# Whole-word, case-insensitive keywords → scheduler tags.
# Edit this file to add household words. Do not add Python if/else for keywords.
# Dress-up "costume" is not Halloween. "swim" does not match "swimming".

[[rule]]
tag = "WINTER"
keywords = [
    "snow",
    "sled",
    "ice",
    "snowy",
    "snowing",
    "winter",
    "frozen",
    "blizzard",
    "igloo",
    "freeze",
]

[[rule]]
tag = "SPRING"
keywords = ["spring", "bloom", "blossom", "tulip", "nest", "hatch"]

[[rule]]
tag = "SUMMER"
keywords = [
    "summer",
    "beach",
    "seaside",
    "swim",
    "swimming",
    "paddling pool",
    "picnic",
    "ice cream",
    "seashell",
]

[[rule]]
tag = "AUTUMN"
keywords = ["autumn", "harvest", "foliage", "acorn", "conker"]

[[rule]]
tag = "MORNING"
keywords = ["breakfast", "wake", "sunrise", "morning"]

[[rule]]
tag = "NIGHT"
keywords = ["moon", "bedtime", "sleep", "stars", "pajamas", "night", "goodnight"]

[[rule]]
tag = "HALLOWEEN"
keywords = ["pumpkin", "halloween"]

[[rule]]
tag = "THANKSGIVING"
keywords = ["thanksgiving", "turkey", "pilgrim"]

[[rule]]
tag = "CHRISTMAS"
keywords = ["christmas", "santa", "reindeer", "stocking"]

[[rule]]
tag = "EASTER"
keywords = ["easter", "bunny"]
