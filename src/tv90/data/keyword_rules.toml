# Title words are the episode theme. Plot words only add weather/setting.
# exclude_phrases cancel a plot match (not a title match).
# Dress-up "costume" is not Halloween. "moon"/"stars" are space, not bedtime.

[[rule]]
tag = "WINTER"
title_keywords = ["snow", "snowy", "sled", "igloo", "freeze", "winter"]
plot_keywords = [
    "snow",
    "snowy",
    "snowing",
    "sled",
    "igloo",
    "blizzard",
    "snowstorm",
    "snowman",
    "snowball",
    "winter",
]
exclude_phrases = ["mr snow", "frozen north"]

[[rule]]
tag = "SPRING"
keywords = ["spring", "bloom", "blossom", "tulip", "nest", "hatch"]

[[rule]]
tag = "SUMMER"
title_keywords = [
    "summer",
    "beach",
    "seaside",
    "swim",
    "swimming",
    "paddling pool",
    "picnic",
    "ice cream",
    "seashell",
    "sunny",
    "sandcastle",
    "sweltering",
    "really hot",
]
plot_keywords = [
    "summer",
    "beach",
    "seaside",
    "swim",
    "swimming",
    "paddling pool",
    "picnic",
    "ice cream",
    "seashell",
    "sunny",
    "sandcastle",
    "sweltering",
]
exclude_phrases = ["ice cream truck"]

[[rule]]
